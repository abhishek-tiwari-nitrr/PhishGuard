[project]
name = "phishguard"
version = "1.0.0"
description = "AI-powered phishing website detection using 30 URL/page-level features"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = [
  "pandas",
  "scipy",
  "pymongo",
  "python-dotenv",
  "certifi",
  "scikit-learn",
  "pyyaml",
  "dagshub",
  "mlflow",
  "fastapi",
  "uvicorn[standard]",
  "pydantic",
  "python-multipart",
  "streamlit",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
