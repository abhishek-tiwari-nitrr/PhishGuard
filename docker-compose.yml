version: "3.11"

services:
  fastapi:
    image: abhishektiwarinitrr/phishguard_v1:latest
    container_name: phishguard-api
    ports:
      - "8000:8000"
    env_file:
      - .env

  streamlit:
    image: abhishektiwarinitrr/phishguard_v1:latest
    container_name: phishguard-ui
    ports:
      - "8501:8501"
    env_file:
      - .env
    command: streamlit run main.py --server.port 8501 --server.address 0.0.0.0
    depends_on:
      - fastapi